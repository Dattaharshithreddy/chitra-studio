name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Install & sync web assets
        working-directory: app
        run: |
          npm ci
          npm run sync
      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee ../../build.log
          cp app/build/outputs/apk/release/app-release.apk ../../ChitraStudio-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: ChitraStudio-apk, path: "ChitraStudio-*.apk" }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chitra Studio v1.0.${{ github.run_number }}
          files: ChitraStudio-*.apk
      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs; git rm -rfq --cached . >/dev/null
          tail -400 build.log > build-tail.log || echo "no log" > build-tail.log
          git add -f build-tail.log; git commit -qm "build log ${{ github.run_number }}"
          git push -f origin ci-logs
